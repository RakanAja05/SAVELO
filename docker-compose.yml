services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:7352 
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: savelo
      DB_USERNAME: root
      DB_PASSWORD: 1234
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - public-data:/var/www/html/public 

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:7352 
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: savelo
      DB_USERNAME: root
      DB_PASSWORD: 1234
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache

  caddy:
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
    ports:
      - "7352:7352"
    depends_on:
      - app
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - public-data:/var/www/html/public

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: savelo
      MYSQL_ROOT_PASSWORD: 1234
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  storage:
  bootstrap-cache:
  caddy-data:
  caddy-config:
  public-data: 